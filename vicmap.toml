[mailbox]
address = "automations@vegetationlink.com.au"
folder = "Inbox"
allowed_senders = ["noreply@datashare.maps.vic.gov.au"]
allowed_order_ids = ["OK0VUZ"]
lookback_days = 15
allow_order_id_mismatch = false
required_authentication_results = ["dkim", "dmarc", "compauth"]

[download]
allowed_hosts = ["s3.ap-southeast-2.amazonaws.com"]
max_bytes = 10737418240
connect_timeout_seconds = 10
read_timeout_seconds = 60
progress_interval_seconds = 5
max_redirects = 5
fingerprint_hex_chars = 16
output_dir = "artifacts"
allowed_url_prefixes = ["https://s3.ap-southeast-2.amazonaws.com/cl-isd-prd-datashare-s3-delivery/"]

[extraction]
run_dir = "runs"
max_total_bytes = 10737418240
max_member_bytes = 4294967296
max_member_count = 4096
max_compression_ratio = 200

[discovery]
supported_formats = ["OpenFileGDB"]
ogrinfo_timeout_seconds = 60

# D-58: no credential key exists here by design. The one secret this phase
# needs reaches the process only through the VICMAP_DB_PASSWORD environment
# variable, populated by opnix from op://nixos-services/vicmap_loader_credentials/password.
[database]
host = "127.0.0.1"
port = 5432
dbname = "vicmap"
user = "vicmap_loader"
staging_schema = "vicmap_staging"
publish_schema = "vicmap"
target_srid = 7899
index_columns = ["pfi"]
gt = 20000
connect_timeout_seconds = 10
statement_timeout_seconds = 3600
lock_timeout_seconds = 30
